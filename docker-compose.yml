services:
  postgres:
    image: postgres:16-alpine
    container_name: pickup-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pickup
      POSTGRES_PASSWORD: pickup
      POSTGRES_DB: pickup
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
