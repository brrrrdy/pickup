<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pickup API Test UI</title>
    <style>
      :root {
        --bg: #f4f6f8;
        --panel: #ffffff;
        --text: #1b1f24;
        --muted: #5f6b76;
        --accent: #0f766e;
        --accent-strong: #0b5b55;
        --border: #d8dee4;
        --ok: #1f8f42;
        --error: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #edf3f8 0%, #f7f9fb 100%);
        color: var(--text);
      }

      .wrap {
        max-width: 900px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      .meta {
        display: grid;
        gap: 8px;
        margin-top: 12px;
        color: var(--muted);
      }

      .form {
        display: grid;
        gap: 12px;
      }

      label {
        font-size: 14px;
        color: var(--muted);
        display: grid;
        gap: 6px;
      }

      input {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 14px;
      }

      .row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 14px;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
      }

      button:hover {
        background: var(--accent-strong);
      }

      .actions {
        display: flex;
        gap: 10px;
      }

      .secondary {
        background: #e7edf2;
        color: #22313f;
      }

      .secondary:hover {
        background: #d8e2ea;
      }

      .status {
        margin-top: 8px;
        font-size: 14px;
      }

      .status.ok {
        color: var(--ok);
      }

      .status.error {
        color: var(--error);
      }

      ul {
        margin: 0;
        padding-left: 18px;
      }

      li {
        margin: 8px 0;
      }

      @media (max-width: 700px) {
        .row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>pickup Test UI</h1>
        <p>Simple single-page tester for your API.</p>
        <div class="meta">
          <div><strong>Logged in as:</strong> Tom</div>
          <div>
            <strong>Test location:</strong> Clapham Common Courts, London
          </div>
          <div><strong>Sport:</strong> Basketball</div>
        </div>
      </div>

      <div class="card">
        <h2>Create a Match</h2>
        <div class="form">
          <label>
            Title
            <input id="title" value="Tom's Test Basketball Run" />
          </label>

          <div class="row">
            <label>
              Starts At
              <input id="startsAt" type="datetime-local" />
            </label>
            <label>
              Duration (minutes)
              <input id="duration" type="number" value="90" min="30" />
            </label>
          </div>

          <label>
            Max Players
            <input id="maxPlayers" type="number" value="10" min="2" />
          </label>

          <div class="actions">
            <button id="createBtn">Create Match at Test Location</button>
            <button class="secondary" id="refreshBtn">Refresh Matches</button>
          </div>
          <div id="status" class="status"></div>
        </div>
      </div>

      <div class="card">
        <h2>Open Matches</h2>
        <ul id="matches"></ul>
      </div>
    </div>

    <script>
      const TOM_USER_ID = "11111111-1111-1111-1111-111111111111";
      const BASKETBALL_SPORT_ID = "33333333-3333-3333-3333-333333333333";
      const TEST_VENUE_ID = "55555555-5555-5555-5555-555555555555";

      const titleInput = document.getElementById("title");
      const startsAtInput = document.getElementById("startsAt");
      const durationInput = document.getElementById("duration");
      const maxPlayersInput = document.getElementById("maxPlayers");
      const matchesList = document.getElementById("matches");
      const statusEl = document.getElementById("status");

      function setDefaultStartTime() {
        const nextHour = new Date(Date.now() + 60 * 60 * 1000);
        nextHour.setMinutes(0, 0, 0);
        startsAtInput.value = nextHour.toISOString().slice(0, 16);
      }

      function setStatus(message, kind) {
        statusEl.textContent = message;
        statusEl.className = `status ${kind || ""}`;
      }

      async function loadMatches() {
        try {
          const response = await fetch("/matches?status=open");
          const data = await response.json();

          matchesList.innerHTML = "";

          if (!data.matches || data.matches.length === 0) {
            const li = document.createElement("li");
            li.textContent = "No open matches yet.";
            matchesList.appendChild(li);
            return;
          }

          data.matches.forEach((match) => {
            const li = document.createElement("li");
            li.textContent = `${match.title} | ${match.sport_name} | ${match.venue_name} | ${new Date(match.starts_at).toLocaleString()} | ${match.joined_players}/${match.max_players}`;
            matchesList.appendChild(li);
          });
        } catch (error) {
          setStatus("Could not load matches.", "error");
        }
      }

      async function createMatch() {
        setStatus("Creating match...", "");

        try {
          const startsAtIso = new Date(startsAtInput.value).toISOString();
          const payload = {
            hostUserId: TOM_USER_ID,
            sportId: BASKETBALL_SPORT_ID,
            venueId: TEST_VENUE_ID,
            title: titleInput.value.trim(),
            startsAt: startsAtIso,
            durationMinutes: Number(durationInput.value),
            maxPlayers: Number(maxPlayersInput.value),
          };

          const response = await fetch("/matches", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const body = await response.json();

          if (!response.ok) {
            setStatus(
              `Create failed: ${body.error || "unknown_error"}`,
              "error",
            );
            return;
          }

          setStatus(`Created match: ${body.id}`, "ok");
          await loadMatches();
        } catch (error) {
          setStatus("Create failed: invalid date or network issue.", "error");
        }
      }

      document
        .getElementById("createBtn")
        .addEventListener("click", createMatch);
      document
        .getElementById("refreshBtn")
        .addEventListener("click", loadMatches);

      setDefaultStartTime();
      loadMatches();
    </script>
  </body>
</html>
